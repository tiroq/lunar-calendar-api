name: Public Lunar API CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test]"
      - run: pytest -q
      - name: Verify no bundled private data
        run: |
          test ! -d private-data
          test ! -d content
          test ! -f content.json

  postgres:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lunar
          POSTGRES_USER: lunar
          POSTGRES_PASSWORD: ci_password
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U lunar -d lunar"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://lunar:ci_password@localhost:5432/lunar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[postgres,test]"
      - run: pytest -q tests/test_database.py
